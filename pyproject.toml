[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-consistency"
version = "0.1.0"
description = "Reproducible MongoDB client-centric consistency experiment"
requires-python = ">=3.14"
dependencies = ["pymongo==4.18.1"]

[tool.setuptools.packages.find]
where = ["src"]
