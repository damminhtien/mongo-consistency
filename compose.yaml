name: mongo-consistency

services:
  mongo1:
    image: mongo:7.0.34
    hostname: mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    networks:
      client_net:
        ipv4_address: ${MC_MONGO1_CLIENT_IP:-172.19.0.2}
      replica_net:
        ipv4_address: ${MC_MONGO1_REPLICA_IP:-172.20.0.2}
    extra_hosts:
      - "mongo1=${MC_MONGO1_REPLICA_IP:-172.20.0.2}"
      - "mongo2=${MC_MONGO2_REPLICA_IP:-172.20.0.3}"
      - "mongo3=${MC_MONGO3_REPLICA_IP:-172.20.0.4}"
    ports:
      - "${MC_MONGO1_HOST_PORT:-27017}:27017"
      - "${MC_MONGO1_CONTROL_HOST_PORT:-29091}:29091"
    volumes: [mongo1-data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo2:
    image: mongo:7.0.34
    hostname: mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    networks:
      client_net:
        ipv4_address: ${MC_MONGO2_CLIENT_IP:-172.19.0.3}
      replica_net:
        ipv4_address: ${MC_MONGO2_REPLICA_IP:-172.20.0.3}
    extra_hosts:
      - "mongo1=${MC_MONGO1_REPLICA_IP:-172.20.0.2}"
      - "mongo2=${MC_MONGO2_REPLICA_IP:-172.20.0.3}"
      - "mongo3=${MC_MONGO3_REPLICA_IP:-172.20.0.4}"
    ports:
      - "${MC_MONGO2_HOST_PORT:-27018}:27017"
      - "${MC_MONGO2_CONTROL_HOST_PORT:-29092}:29092"
    volumes: [mongo2-data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo3:
    image: mongo:7.0.34
    hostname: mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    networks:
      client_net:
        ipv4_address: ${MC_MONGO3_CLIENT_IP:-172.19.0.4}
      replica_net:
        ipv4_address: ${MC_MONGO3_REPLICA_IP:-172.20.0.4}
    extra_hosts:
      - "mongo1=${MC_MONGO1_REPLICA_IP:-172.20.0.2}"
      - "mongo2=${MC_MONGO2_REPLICA_IP:-172.20.0.3}"
      - "mongo3=${MC_MONGO3_REPLICA_IP:-172.20.0.4}"
    ports:
      - "${MC_MONGO3_HOST_PORT:-27019}:27017"
      - "${MC_MONGO3_CONTROL_HOST_PORT:-29093}:29093"
    volumes: [mongo3-data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --host 127.0.0.1 --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  runner:
    image: mongo-consistency-runner:local
    build:
      context: .
      dockerfile: infra/runner/Dockerfile
    networks: [client_net]
    read_only: true
    stop_grace_period: 90s
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${MC_RESULTS_MOUNT:-./results}:/workspace/results:rw
      - ${MC_FIGURES_MOUNT:-./figures}:/workspace/figures:rw
      - ${MC_SETUP_MOUNT:-./results/setup/toolchain.json}:/workspace/setup/toolchain.json:ro
    environment:
      MC_SETUP_PROVENANCE: ${MC_SETUP_PROVENANCE:-/workspace/setup/toolchain.json}
      FAULT_CONTROLLER_MONGO1: http://mongo1:29091
      FAULT_CONTROLLER_MONGO2: http://mongo2:29092
      FAULT_CONTROLLER_MONGO3: http://mongo3:29093
    depends_on:
      mongo1: {condition: service_healthy}
      mongo2: {condition: service_healthy}
      mongo3: {condition: service_healthy}
    entrypoint: ["python"]

  fault-controller-1:
    build:
      context: infra/fault-controller
    network_mode: service:mongo1
    cap_add: [NET_ADMIN]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      MEMBER: mongo1
      CONTROL_PORT: "29091"
      REPLICA_INTERFACE: eth1
    depends_on:
      mongo1: {condition: service_healthy}

  fault-controller-2:
    build:
      context: infra/fault-controller
    network_mode: service:mongo2
    cap_add: [NET_ADMIN]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      MEMBER: mongo2
      CONTROL_PORT: "29092"
      REPLICA_INTERFACE: eth1
    depends_on:
      mongo2: {condition: service_healthy}

  fault-controller-3:
    build:
      context: infra/fault-controller
    network_mode: service:mongo3
    cap_add: [NET_ADMIN]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    environment:
      MEMBER: mongo3
      CONTROL_PORT: "29093"
      REPLICA_INTERFACE: eth1
    depends_on:
      mongo3: {condition: service_healthy}

networks:
  client_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${MC_CLIENT_SUBNET:-172.19.0.0/16}
  replica_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${MC_REPLICA_SUBNET:-172.20.0.0/16}

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
